<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelfBlock</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SelfBlock</h1>
      <p class="subtitle">Block distracting websites</p>
    </div>

    <div class="current-site">
      <div class="site-info">
        <span class="site-url" id="currentSite">Loading...</span>
        <span class="site-status" id="siteStatus"></span>
      </div>
      <button class="btn-toggle" id="toggleBlock">
        <span id="toggleText">Block This Site</span>
      </button>
    </div>

    <div class="blocked-list">
      <div class="list-header">
        <h3>Blocked Websites</h3>
        <span class="count" id="blockedCount">0</span>
      </div>
      <div class="list-content" id="blockedSites">
        <p class="empty-state">No blocked sites yet</p>
      </div>
    </div>

    <!-- <div class="actions">
      <button class="btn-secondary" id="viewReview">
        📊 View Monthly Review
      </button>
      <button class="btn-secondary" id="clearAll">
        🗑️ Clear All Blocks
      </button>
    </div> -->

    <div class="footer">
      <p>OpenSourced by Lime Green Studios</p>
    </div>
  </div>
  <script src="../scripts/popup.js"></script>
</body>
</html>
