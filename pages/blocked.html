<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/blocked.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="header">
      <span class="logo">getinsultd.io</span>
      <button onclick="window.location.href='https://github.com/limegreen-studios/getinsultd';" class="star-button" id="starButton">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="star-icon"
        >
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
        <span id="starCount">-</span>
      </button>
    </div>

    <div class="container">
      <h1 class="insult" id="insultText"></h1>
      <button class="motivational-button" id="motivationalButton">
        <div class="button-content">
          <div class="dot"></div>
          <span class="button-text" id="buttonText"></span>
        </div>
        <div class="button-hover-content">
          <span class="button-hover-text" id="buttonHoverText"></span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="arrow-icon"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </div>
      </button>
    </div>

    <div class="footer">
      <span class="footer-text">Open Sourced by Lime Green Studios</span>
    </div>
  </div>

  <script src="../scripts/blocked.js"></script>
</body>
</html>
